<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kastkeur</title>
<meta name="description" content="Groepenkast en woning keuren, metingen vastleggen en rapporten maken.">
<meta name="theme-color" content="#15202B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: mobiele app — vaste kopbalk, één kolom werkblad, tabbalk onderin; op desktop een smalle centrale kolom. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --sunk:#E3E8EC; --ink:#15202B; --muted:#5A6774; --line:#D3DAE0;
  --accent:#A9521C; --accent-soft:#F6E6DB; --on-accent:#FFFFFF;
  --ok:#1C7A4C; --ok-soft:#DDF1E6; --warn:#9A6408; --warn-soft:#FBEFD6; --bad:#BA3328; --bad-soft:#F9E0DD; --open:#66727E; --open-soft:#E6EAED;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F27; --sunk:#1D2832; --ink:#E5EBF0; --muted:#94A2AF; --line:#2A3641;
  --accent:#E3884F; --accent-soft:#3A2618; --on-accent:#1A0F08;
  --ok:#4FC38B; --ok-soft:#163327; --warn:#E5B54A; --warn-soft:#3A2E14; --bad:#F2766B; --bad-soft:#3D1E1B; --open:#93A0AC; --open-soft:#24303A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F27; --sunk:#1D2832; --ink:#E5EBF0; --muted:#94A2AF; --line:#2A3641;
  --accent:#E3884F; --accent-soft:#3A2618; --on-accent:#1A0F08;
  --ok:#4FC38B; --ok-soft:#163327; --warn:#E5B54A; --warn-soft:#3A2E14; --bad:#F2766B; --bad-soft:#3D1E1B; --open:#93A0AC; --open-soft:#24303A;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,select,input,textarea{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b{color:var(--accent)}
.ttl{flex:1;min-width:0}
.ttl .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savest{font-size:12px;color:var(--muted);white-space:nowrap}
main{padding-block:18px 110px}
main.home{padding-bottom:40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;max-width:68ch}
.banner{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{color:var(--ok);background:var(--ok-soft)}
.st-let{color:var(--warn);background:var(--warn-soft)}
.st-nok{color:var(--bad);background:var(--bad-soft)}
.st-open{color:var(--open);background:var(--open-soft)}

/* home list */
.klist{display:flex;flex-direction:column;gap:10px}
.kcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.kcard:hover{border-color:var(--muted)}
.kcard img,.kcard .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk)}
.kcard .ph{display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:20px}
.kcard .body{flex:1;min-width:0}
.kcard .body .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .body .s{font-size:13px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--sunk)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;cursor:pointer}
.photo .tag{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.aiout{font-size:13px;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:auto;font-family:var(--f-mono);background:var(--sunk);border-radius:8px;padding:8px}
.find{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.find:first-child{border-top:0;padding-top:0}
.find .tx{flex:1;min-width:0}

/* rail / component strip — schematic of the kast */
.rail{display:flex;gap:4px;overflow-x:auto;padding:10px;background:var(--sunk);border-radius:8px}
.mod{flex:none;width:44px;min-height:70px;border-radius:5px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;font-family:var(--f-mono);font-size:11px;text-align:center;line-height:1.15}
.mod .k{font-weight:500}
.mod .n{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.mod.w2{width:92px}.mod.w4{width:184px}
.mod.als{border-color:var(--accent);background:var(--accent-soft)}
.mod.hs{border-color:var(--ink)}
.mod .lnk{width:100%;height:4px;border-radius:2px}

/* group cards */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.gcard .gh{display:flex;align-items:center;gap:10px}
.gnr{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;min-width:34px;color:var(--accent)}
.gh .sp{flex:1;min-width:0}
.ggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ggrid .wide{grid-column:span 4}
@media (max-width:460px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}.ggrid .wide{grid-column:span 2}}

/* checks */
.check{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;border-left-width:4px}
.check.b-ok{border-left-color:var(--ok)}.check.b-nok{border-left-color:var(--bad)}.check.b-let{border-left-color:var(--warn)}.check.b-open{border-left-color:var(--line)}
.check .ch{display:flex;gap:10px;align-items:flex-start}
.check .ch .tx{flex:1;min-width:0}
.check .ref{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--surface);color:var(--muted);padding:6px 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on.v-ok{background:var(--ok);color:var(--surface)}
.seg button.on.v-nok{background:var(--bad);color:var(--surface)}
.seg button.on.v-nvt{background:var(--open);color:var(--surface)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.sbox .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.sbox .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}

/* measurement table */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--accent)}
table.t input{width:80px;padding:7px 8px}
.cell{display:flex;flex-direction:column;gap:3px}
.inrow{display:flex;gap:4px;align-items:center}
.snap{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.snap:hover{color:var(--accent);border-color:var(--accent)}
.snap svg{width:18px;height:18px}
.snap.busy{color:var(--accent);border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.snap.busy svg{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.flash{outline:2px solid var(--ok);outline-offset:1px}
.lim{font-size:11px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px;vertical-align:middle}
.d-ok{background:var(--ok)}.d-nok{background:var(--bad)}.d-let{background:var(--warn)}.d-open{background:transparent;border:1px solid var(--line)}

/* report preview */
.gv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gv .gvh{background:var(--ink);color:var(--surface);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.gv .gvh h3{color:var(--surface)}
.dlrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

/* confirm sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--surface);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{font:inherit;border:0;background:transparent;color:var(--muted);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.tab .ico{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.01em;text-transform:uppercase}
@media (min-width:480px){.tab .ico{font-size:15px;letter-spacing:.04em}}
.tab .cnt{font-size:11px;font-family:var(--f-mono)}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
/* woning */
.vd{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.room.openr{border-color:var(--accent)}
.rhead{display:flex;align-items:center;gap:10px;width:100%;padding:12px;background:transparent;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.rhead .nm{flex:1;min-width:0}
.rhead .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .chev{color:var(--muted);font-size:18px;transition:transform .15s}
.room.openr .rhead .chev{transform:rotate(90deg)}
.rbody{padding:0 12px 14px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer;font-family:var(--f-mono)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fotos{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fthumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.fthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fthumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.mp{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end}
.mp .lim{grid-column:auto}
@media (max-width:520px){.mp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mp .wide{grid-column:span 2}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>
</head>
<body>

<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="snapin" type="file" accept="image/*" capture="environment" hidden>
<input id="fotoin" type="file" accept="image/*" hidden>

<script>
"use strict";
/* ---------- constanten ---------- */
const DEFAULT_GRENS = {maxGroepenPerAls:4, risoMin:1.0, testspanning:500, t1:300, t5:40, raMax:166, u0:230};
const KAR_K = {B:5, C:10, D:20};
const MANUAL = [

  {k:"m11", t:"Reserveruimte aanwezig voor uitbreiding", ref:"advies"}
];
const VERDIEPINGEN = ["Kelder","Begane grond","1e verdieping","2e verdieping","Zolder","Buiten"];
const SOORTEN = [["verblijf","Woon- of slaapkamer"],["verkeer","Hal, overloop, trap"],["keuken","Keuken"],["badkamer","Badkamer of douche"],["toilet","Toilet"],["techniek","Meterkast of techniekruimte"],["bijgebouw","Schuur, garage, berging"],["buiten","Buiten, tuin, gevel"]];
const RC = {
  alg:[
    {k:"r_wcd", t:"Wandcontactdozen met randaarde, goed vast en werkend", ref:"411 / 553.1"},

  keuken:[
    {k:"k_eig", t:"Vaste toestellen (vaatwasser, oven, combimagnetron) op eigen groep", ref:"woningpraktijk"},
    {k:"k_kook", t:"Kookplaat juist aangesloten: juiste groep(en), doorsnede en aansluitpunt", ref:"433 / 523"},

  badkamer:[
    {k:"b_zone", t:"Toestellen en schakelaars passend bij zone 0, 1 en 2 (IP-graad)", ref:"701.512.2"},

function idb(){

  });
}
async function tx(storeName, mode, fn){

}

function parseJsonLoose(t){
  try { return JSON.parse(t); } catch(e){}

async function callClaude(prompt, images, signal){

      body: JSON.stringify({model: SET.model, max_tokens: 8000, messages:[{role:"user", content}]})});
  } catch(e) { if (e && e.name === "AbortError") throw {code:"cancelled"}; throw {code:"offline"}; }
  if (!r.ok) { const code = r.status===401||r.status===403 ? "auth" : r.status===429 ? "rate_limited" : r.status===529||r.status>=500 ? "overloaded" : r.status===402||r.status===400 ? "bad_request" : "upstream_error";
    let msg = ""; try { msg = (await r.json()).error?.message || ""; } catch(e){} throw {code, message: msg}; }
  const j = await r.json();

}

function measureStats(){

function sel(id, path, val, opts){ return `<select id="${id}" data-b="${path}" data-re>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}"${String(val)===String(v)?" selected":""}>${esc(l)}</option>`;}).join("")}</select>`; }
function inp(id, path, val, extra=""){ return `<input type="text" id="${id}" data-b="${path}" value="${esc(val)}" ${extra}>`; }
function ninp(id, path, val, extra=""){ return `<input type="text" inputmode="decimal" class="num" id="${id}" data-b="${path}" value="${esc(val)}" ${extra}>`; }

const SNAP_ON = false; // display aflezen uitgeschakeld (kost Claude-gebruik)
const CAM_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
function minp(id, path, val, label, unit, extra=""){
  const field = ninp(id, path, val, extra);
  if (!SNAP_ON || !(sampleFn && sampleImg)) return field;
  return `<span class="inrow">${field}<button class="snap${SNAP.busy===path?" busy":""}" data-snap="${esc(path)}" data-lbl="${esc(label)}" data-unit="${esc(unit)}" data-for="${id}" aria-label="Foto van display voor ${esc(label)}" title="Waarde van display aflezen">${CAM_SVG}</button></span>`;
}
function render(){
  const app = $("#app");
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  if (VIEW === "settings") { app.innerHTML = renderSettings(); }
  else if (VIEW === "home" || !K) { app.innerHTML = renderHome(); }
  else {
    const body = {kast:renderKast, groepen:renderGroepen, woning:renderWoning, keuring:renderKeuring, metingen:renderMetingen, rapport:renderRapport}[VIEW]();
    app.innerHTML = renderTop() + `<main><div class="wrap">${K.voorbeeld?`<div class="banner" style="margin-bottom:16px">Dit is een voorbeeldkeuring op basis van een echte groepenkast. Pas alles gerust aan of begin een nieuwe.</div>`:""}${body}</div></main>` + renderTabs();
  }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus({preventScroll:true}); } }
  if (render.keepScroll) window.scrollTo(0, y);
  render.keepScroll = false;
  renderSheet();
}
function renderTop(){
  return `<header class="top"><div class="wrap">
    <button class="btn ghost" data-act="home" aria-label="Terug naar overzicht">←</button>
    <div class="ttl"><div class="t">${esc(K.adres || "Nieuwe keuring")}</div><div class="s">${nlDate(K.datum)} · ${K.soort==="nieuw"?"Nieuwe installatie":"Renovatie"}</div></div>
    <div class="savest" id="savest">${esc(saveState)}</div></div></header>`;
}
function renderTabs(){
  const cs = checkSummary(), m = measureStats();
  const tabs = [["kast","Kast", PHOTOS.length?`${PHOTOS.length} foto`:"foto"],["groepen","Groepen", K.groepen.length],["woning","Woning", (K.ruimtes||[]).length?`${K.ruimtes.length} rmt`:"–"],["keuring","Keuring", cs.nok?`${cs.nok} afw.`:`${cs.open} open`],["metingen","Metingen",`${m.done}/${m.tot}`],["rapport","Rapport","pdf"]];
  return `<nav class="tabs" aria-label="Stappen"><div class="in">${tabs.map(([v,l,c])=>`<button class="tab${VIEW===v?" on":""}" data-view="${v}"${VIEW===v?' aria-current="page"':""}><span class="ico">${l}</span><span class="cnt">${esc(c)}</span></button>`).join("")}</div></nav>`;
}

let INSTALL = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL = e; if (VIEW==="home") render(); });
window.addEventListener("appinstalled", () => { INSTALL = null; toast("Kastkeur is geïnstalleerd"); if (VIEW==="home") render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

function loadFotoUrlsReset(){ for (const k in FURL) { URL.revokeObjectURL(FURL[k]); delete FURL[k]; } }
function renderSettings(){
  const ks = SET.apiKey ? SET.apiKey.slice(0,10) + "…" + SET.apiKey.slice(-4) : "";
  return `<header class="top"><div class="wrap"><button class="btn ghost" data-act="home" aria-label="Terug">←</button><div class="ttl"><div class="t">Instellingen</div></div></div></header>
  <main class="home"><div class="wrap">
  <div class="sec"><h2>Claude</h2>
    <p class="lead">Voor het aflezen van foto's van de groepenkast. Elke analyse kost een paar cent van je tegoed op console.anthropic.com.</p>
    <div class="panel stack">
      <label class="f"><span>API-sleutel</span><input type="password" id="s_key" value="" placeholder="${ks?esc(ks):"sk-ant-…"}" autocomplete="off" spellcheck="false"></label>
      <div class="row"><button class="btn pri small" data-act="savekey">Sleutel opslaan</button>${SET.apiKey?`<button class="btn small" data-act="testkey">Test verbinding</button><button class="btn ghost small danger" data-act="delkey">Verwijder sleutel</button>`:""}</div>
      <label class="f"><span>Model</span><select id="s_model">${MODELLEN.map(([v,l])=>`<option value="${v}"${SET.model===v?" selected":""}>${esc(l)}</option>`).join("")}</select></label>
      <p class="note" style="margin:0">De sleutel blijft alleen op deze telefoon en wordt alleen naar Anthropic gestuurd. Deel je telefoon niet ontgrendeld met anderen.</p>
    </div></div>
  <div class="sec"><h2>Standaardgegevens</h2>
    <div class="panel stack">
      <label class="f"><span>Naam installateur</span><input type="text" id="s_inst" value="${esc(SET.installateur)}" placeholder="Wordt ingevuld bij nieuwe keuringen"></label>
      <label class="chk"><input type="checkbox" id="s_delen" ${SET.pdfDelen?"checked":""}> PDF via deelmenu (Mail, WhatsApp, Bestanden) in plaats van Downloads</label>
    </div></div>
  <div class="sec"><h2>Back-up</h2>
    <p class="lead">Je keuringen staan alleen op deze telefoon. Bewaar een back-up op een veilige plek, bijvoorbeeld in Google Drive.</p>
    <div class="row"><button class="btn" data-act="backup">Back-up maken</button><label class="btn" for="s_imp">Back-up terugzetten</label><input id="s_imp" type="file" accept="application/json,.json" hidden></div>
  </div>
  <p class="note" style="margin-top:26px">Kastkeur beta · ${LIST.length} keuring(en) op dit toestel</p>
  </div></main>`;
}
function renderHome(){
  const where = "Je keuringen staan op deze telefoon. Maak af en toe een back-up via Instellingen.";
  let list;
  if (!loaded) list = `<div class="empty"><div class="muted">Keuringen laden…</div></div>`;
  else if (!LIST.length) list = `<div class="empty"><h3>Nog geen keuringen</h3>
      <p class="muted" style="margin:0">Begin met een foto van de groepenkast. Claude leest de componenten af, jij controleert en vult de metingen aan. Daarna maak je het keuringsrapport, meetrapport en de groepenverklaring als PDF.</p>
      <div class="row"><button class="btn pri" data-act="new">Nieuwe keuring</button><button class="btn" data-act="example">Voorbeeld openen</button></div></div>`;
  else list = `<div class="klist">${LIST.map(k => {
      const n = k.groepen?.length||0;
      return `<button class="kcard" data-open="${esc(k.id)}">${k.thumb?`<img src="${k.thumb}" alt="">`:`<span class="ph">${n||"–"}</span>`}
        <span class="body"><span class="t" style="display:block">${esc(k.adres||"Zonder adres")}${k.voorbeeld?' <span class="pill st-open">Voorbeeld</span>':""}</span>
        <span class="s" style="display:block">${nlDate(k.datum)} · ${k.soort==="nieuw"?"Nieuw":"Renovatie"} · ${n} groepen · ${(k.als||[]).length} ALS</span></span></button>`;}).join("")}</div>`;
  return `<header class="top"><div class="wrap"><div class="brand">Kast<b>keur</b></div><div class="ttl"><div class="s">Groepenkast keuren, meten en vastleggen</div></div>${INSTALL?`<button class="btn small pri" data-act="install">Installeren</button>`:""}<button class="btn small" data-act="settings">Instellingen</button></div></header>
  <main class="home"><div class="wrap stack">
    <div class="sec-h"><h2>Keuringen</h2>${LIST.length?`<div class="row"><button class="btn small" data-act="example">Voorbeeld</button><button class="btn pri small" data-act="new">Nieuwe keuring</button></div>`:""}</div>
    ${list}
    <p class="note">${where} Foto's van de kast worden alleen gebruikt voor de analyse; foto's bij afwijkingen worden wel bewaard. Grenswaarden en bepalingsnummers in deze beta zijn een hulpmiddel; controleer ze met je eigen exemplaar van NEN 1010.</p>
  </div></main>`;
}

function renderKast(){
  const photos = PHOTOS.map((p,i)=>`<div class="photo"><img src="${p.url}" alt="Foto ${i+1}"><span class="tag">${i===0?"Overzicht":"Close-up"}</span><button data-delphoto="${i}" aria-label="Foto verwijderen">×</button></div>`).join("");
  const maxN = AI.max || 4;
  let aiBlock;
  if (!SET.apiKey) aiBlock = `<p class="note">Om foto's door Claude te laten aflezen, vul je eerst je API-sleutel in bij Instellingen. Groepen met de hand invullen kan altijd.</p><button class="btn small" data-act="settings" style="align-self:flex-start">Naar instellingen</button>`;
  else if (!sampleImg) aiBlock = `<p class="note">Foto's naar Claude sturen is in deze weergave niet mogelijk. Vul de groepen met de hand in.</p>`;
  else aiBlock = `<div class="row">
      <button class="btn pri" data-act="analyse" ${(!PHOTOS.length||AI.busy)?"disabled":""}>${AI.busy?"Claude bekijkt de foto's…":"Analyseer foto's"}</button>
      ${AI.busy?`<button class="btn" data-act="stop">Stop</button>`:""}
      <span class="small muted">${PHOTOS.length?`${PHOTOS.length} van max. ${maxN} foto's`:"Voeg eerst een foto toe"}</span></div>
      ${AI.busy?`<div class="aiout" id="aiout">Bezig… dit duurt meestal 20 tot 60 seconden.</div>`:""}
      ${AI.err?`<p class="note" style="border-color:var(--bad)">${esc(AI.err)}</p>`:""}`;
  const res = AI.result ? `<div class="panel stack"><div class="sec-h"><h3>Gevonden op de foto's</h3></div>
      <div class="rail">${railHtml(AI.result.hsObj, AI.result.alsArr, AI.result.grpArr)}</div>
      <p class="small" style="margin:0">${AI.result.grpArr.length} groepen, ${AI.result.alsArr.length} aardlekschakelaar(s)${AI.result.hsObj.aanwezig?`, hoofdschakelaar ${AI.result.hsObj.polen}P ${AI.result.hsObj.In||"?"} A`:""}.</p>
      <div class="row"><button class="btn pri" data-act="apply">Overnemen in groepenlijst</button><button class="btn" data-act="discard">Negeren</button></div></div>` : "";
  const bev = K.ai?.bevindingen?.length ? `<div class="sec"><div class="sec-h"><h2>Bevindingen uit foto</h2><span class="small muted">${K.ai.datum?new Date(K.ai.datum).toLocaleDateString("nl-NL"):""}</span></div>
      <div class="panel">${K.ai.bevindingen.map(b=>`<div class="find">${pill(b.ernst==="afwijking"?"nok":b.ernst==="let op"?"let":"open")}<div class="tx">${esc(b.tekst)}</div></div>`).join("")}
      ${K.ai.advies?`<div class="find"><span class="pill st-open">Tip</span><div class="tx">${esc(K.ai.advies)}</div></div>`:""}</div></div>` : "";
  return `
  <div class="sec"><div class="sec-h"><h2>Foto's van de kast</h2></div>
    <p class="lead">Begin met één foto van de hele kast. Voeg daarna close-ups per rij toe, zodat Claude de kleine opdrukken (B16, 30 mA, type A) kan lezen.</p>
    ${PHOTOS.length?`<div class="photos">${photos}</div>`:""}
    <div class="row">
      <label class="btn" for="cam">Foto maken</label><input id="cam" type="file" accept="image/*" capture="environment" hidden>
      <label class="btn" for="gal">Uit galerij</label><input id="gal" type="file" accept="image/*" multiple hidden>
    </div>
    ${aiBlock}${res}
  </div>
  ${bev}
  <div class="sec"><h2>Project</h2>
    <div class="panel grid2">
      <label class="f"><span>Adres</span>${inp("adres","adres",K.adres,'placeholder="Straat, huisnummer, plaats"')}</label>
      <label class="f"><span>Opdrachtgever</span>${inp("opdr","opdrachtgever",K.opdrachtgever)}</label>
      <label class="f"><span>Datum</span><input type="date" id="datum" data-b="datum" value="${esc(K.datum)}"></label>
      <label class="f"><span>Soort werk</span>${sel("soort","soort",K.soort,[["nieuw","Nieuwe installatie"],["renovatie","Renovatie"]])}</label>
      <label class="f"><span>Uitgevoerd door</span>${inp("inst","installateur",K.installateur)}</label>
    </div></div>
  <div class="sec"><h2>Installatie</h2>
    <div class="panel stack">
      <div class="grid3">
        <label class="f"><span>Aansluiting</span>${sel("aansl","aansluiting",K.aansluiting,["1-fase","3-fase"])}</label>
        <label class="f"><span>Stelsel</span>${sel("stelsel","stelsel",K.stelsel,["TN-C-S","TN-S","TT"])}</label>
        <label class="f"><span>Overspanningsbev.</span>${sel("ovsp","overspanning",K.overspanning,[["onbekend","Nog bepalen"],["ja","Aanwezig"],["nee","Niet aanwezig"],["beoordeeld","Niet nodig (beoordeeld)"]])}</label>
      </div>
      <div class="grid3">
        <label class="chk"><input type="checkbox" id="hsa" data-b="hs.aanwezig" data-re ${K.hs.aanwezig?"checked":""}> Hoofdschakelaar</label>
        <label class="f"><span>Polen</span>${sel("hsp","hs.polen",K.hs.polen,[[2,"2-polig"],[4,"4-polig"]])}</label>
        <label class="f"><span>Stroom (A)</span>${ninp("hsin","hs.In",K.hs.In)}</label>
      </div>
      <div><div class="small muted" style="margin-bottom:6px">Aanwezig in de woning</div>
      <div class="row">${[["laadpaal","Laadpaal"],["pv","Zonnepanelen"],["wp","Warmtepomp"],["inductie","Inductiekookplaat"]].map(([k,l])=>`<label class="chk"><input type="checkbox" id="b_${k}" data-b="bijz.${k}" data-re ${K.bijz[k]?"checked":""}> ${l}</label>`).join("")}</div></div>
    </div></div>
  <div class="sec"><button class="btn danger" data-act="askdel" style="align-self:flex-start">Keuring verwijderen</button></div>`;
}

function railHtml(hs, als, grp){
  const parts = [];
  if (hs && hs.aanwezig) parts.push(`<div class="mod hs w${hs.polen==4?4:2}" title="Hoofdschakelaar"><span class="k">HS</span><span>${hs.In||"?"} A</span><span class="n">${hs.polen}P</span></div>`);
  als.forEach(a => parts.push(`<div class="mod als w${a.polen==2?2:4}"><span class="k">${esc(a.id)}</span><span>${a.In||"?"} A · ${a.idn||"?"} mA</span><span class="n">type ${esc(a.type||"?")}</span></div>`));
  grp.forEach(g => parts.push(`<div class="mod${/3P/.test(g.polen)?" w4":/2P/.test(g.polen)?" w2":""}"><span class="k">${esc(g.kar||"?")}${g.In||"?"}</span><span class="small muted">${esc(g.als||"–")}</span><span class="n">${g.nr}</span></div>`));
  return parts.join("") || `<span class="small muted">Nog niets.</span>`;
}

function renderGroepen(){
  const alsOpts = [["","Nog kiezen"]].concat(K.als.map(a=>[a.id,a.id]));
  const alsCards = K.als.map((a,i)=>`<div class="gcard"><div class="gh"><span class="gnr">${esc(a.id)}</span><span class="sp small muted">Aardlekschakelaar · ${K.groepen.filter(g=>g.als===a.id).length} groepen</span><button class="btn ghost small danger" data-delals="${i}">Verwijder</button></div>
    <div class="ggrid"><label class="f"><span>Polen</span>${sel(`ap${i}`,`als.${i}.polen`,a.polen,[[2,"2P"],[4,"4P"]])}</label>
    <label class="f"><span>In (A)</span>${ninp(`ai${i}`,`als.${i}.In`,a.In)}</label>
    <label class="f"><span>IΔn (mA)</span>${ninp(`ad${i}`,`als.${i}.idn`,a.idn,"data-re")}</label>
    <label class="f"><span>Type</span>${sel(`at${i}`,`als.${i}.type`,a.type||"?",[["?","Onbekend"],"A","AC","B","F"])}</label></div></div>`).join("");
  const gCards = K.groepen.map((g,i)=>`<div class="gcard"><div class="gh"><span class="gnr">${g.nr}</span>
      <span class="sp">${inp(`go${i}`,`groepen.${i}.omschr`,g.omschr,'placeholder="Omschrijving, bijv. Keuken wcd" aria-label="Omschrijving"')}</span>
      <button class="btn ghost small danger" data-delgrp="${i}" aria-label="Groep ${g.nr} verwijderen">×</button></div>
    <div class="ggrid">
      <label class="f"><span>Kar.</span>${sel(`gk${i}`,`groepen.${i}.kar`,g.kar,["B","C","D","?"])}</label>
      <label class="f"><span>In (A)</span>${ninp(`gi${i}`,`groepen.${i}.In`,g.In,"data-re")}</label>
      <label class="f"><span>Polen</span>${sel(`gp${i}`,`groepen.${i}.polen`,g.polen,["1P+N","2P","3P+N","1P","?"])}</label>
      <label class="f"><span>Aardlek</span>${sel(`ga${i}`,`groepen.${i}.als`,g.als,alsOpts)}</label>
      <label class="f"><span>Kabel mm²</span>${ninp(`gm${i}`,`groepen.${i}.mm2`,g.mm2)}</label>
    </div></div>`).join("");
  return `
  <div class="sec"><div class="sec-h"><h2>Kastopbouw</h2></div>
    <div class="rail" aria-label="Schematische weergave van de kast">${railHtml(K.hs, K.als, K.groepen)}</div>
    <p class="small muted" style="margin:0">Kar. en stroom per groep, met daaronder de aardlekschakelaar waar de groep op zit.</p></div>
  <div class="sec"><div class="sec-h"><h2>Aardlekschakelaars</h2><button class="btn small" data-act="addals">+ Aardlekschakelaar</button></div>
    ${alsCards || `<div class="empty"><span class="muted">Nog geen aardlekschakelaars. Voeg ze toe of laat Claude de foto analyseren.</span></div>`}</div>
  <div class="sec"><div class="sec-h"><h2>Eindgroepen</h2><button class="btn small" data-act="addgrp">+ Groep</button></div>
    ${gCards || `<div class="empty"><span class="muted">Nog geen groepen.</span></div>`}
    ${K.groepen.length?`<button class="btn" data-act="addgrp" style="align-self:flex-start">+ Groep toevoegen</button>`:""}</div>`;
}

function renderKeuring(){
  const cs = checkSummary();
  const ac = autoChecks(), mc = MANUAL;
  const autoHtml = ac.map(c=>`<div class="check b-${c.st}"><div class="ch"><div class="tx"><div><b>${esc(c.t)}</b></div><div class="small muted">${esc(c.d)}</div><div class="ref">NEN 1010 ${esc(c.ref)}</div></div>${pill(c.st)}</div></div>`).join("");
  const manHtml = mc.map(c=>{ const s = K.checks[c.k]?.s||""; const st = manualSt(c.k);
    return `<div class="check b-${st==="nvt"?"open":st}"><div class="ch"><div class="tx"><div><b>${esc(c.t)}</b></div><div class="ref">${c.ref==="advies"||c.ref==="woningpraktijk"?esc(c.ref):"NEN 1010 "+esc(c.ref)}</div></div></div>
      <div class="row"><div class="seg" role="group" aria-label="Beoordeling">${[["ok","In orde"],["nok","Afwijking"],["nvt","N.v.t."]].map(([v,l])=>`<button class="v-${v}${s===v?" on":""}" data-chk="${c.k}" data-v="${v}" aria-pressed="${s===v}">${l}</button>`).join("")}</div></div>
      ${s==="nok"||K.checks[c.k]?.o?`<input type="text" id="co_${c.k}" data-b="checks.${c.k}.o" value="${esc(K.checks[c.k]?.o||"")}" placeholder="Omschrijf de afwijking">`:""}</div>`;}).join("");
  const bev = K.ai?.bevindingen?.length ? `<div class="sec"><h2>Uit de foto-analyse</h2><div class="panel">${K.ai.bevindingen.map(b=>`<div class="find">${pill(b.ernst==="afwijking"?"nok":b.ernst==="let op"?"let":"open")}<div class="tx">${esc(b.tekst)}</div></div>`).join("")}</div>
     <p class="note">Bevindingen van Claude zijn een hulp bij het kijken. Neem ze over in de checklist hieronder als je ze zelf bevestigt.</p></div>` : "";
  return `
  <div class="sec"><h2>Keuring</h2>
    <div class="summary">${[["ok","In orde"],["let","Let op"],["nok","Afwijking"],["open","Open"]].map(([k,l])=>`<div class="sbox"><div class="v" style="color:var(--${k==="nok"?"bad":k==="let"?"warn":k==="ok"?"ok":"open"})">${cs[k]||0}</div><div class="l">${l}</div></div>`).join("")}</div></div>
  <div class="sec"><div class="sec-h"><h3>Automatisch uit je gegevens</h3></div><div class="stack">${autoHtml}</div></div>
  ${bev}
  <div class="sec"><div class="sec-h"><h3>Visuele inspectie groepenkast</h3></div><div class="stack">${manHtml}</div></div>
  <div class="sec"><div class="sec-h"><h3>Woning</h3><button class="btn small" data-view="woning">Naar ruimtes</button></div>
    ${(K.ruimtes||[]).length ? `<div class="panel">${K.ruimtes.map(r=>{const s=roomSt(r);return `<div class="find">${pill(s.nok?"nok":s.open?"open":"ok")}<div class="tx"><b>${esc(r.naam)}</b> <span class="small muted">${s.nok?`${s.nok} afwijking(en)`:s.open?`${s.open} van ${s.tot} open`:"alles beoordeeld"}</span></div></div>`;}).join("")}</div>` : `<div class="empty"><span class="muted">Nog geen ruimtes. Voeg ze toe op het tabblad Woning.</span></div>`}</div>
  <div class="sec"><h3>Opmerkingen voor het rapport</h3><textarea id="opm" data-b="opmerkingen" placeholder="Bijv. advies aan bewoner, afspraken over herstel">${esc(K.opmerkingen)}</textarea></div>
  <p class="note" style="margin-top:20px">Bepalingsnummers zijn een hulpmiddel en kunnen afwijken per versie van NEN 1010. Controleer ze met je eigen exemplaar.</p>`;
}

function renderMetingen(){
  const G = K.grens;

async function addFoto(file){
  const t = FOTO_T; if (!t || !K) return; FOTO_T = null;
  const r = K.ruimtes[t.ri]; if (!r) return;
  const big = await shrink(file, 1280, 0.8);
  let entry = null;
  if (assetsFn && big) { try { const a = await assetsFn.upload(big); entry = {id:a.id, url:a.url}; } catch(e){ entry = null; } }
  if (!entry) { const small = await shrink(file, 560, 0.6, true); if (!small) { toast("Foto kon niet worden gelezen."); return; } entry = {data: small}; }
  r.checks[t.k] = r.checks[t.k] || {}; r.checks[t.k].f = (r.checks[t.k].f||[]).concat(entry);
  changed(); render.keepScroll = true; render(); toast("Foto toegevoegd");
}
function shrink(file, max, q, asData){
  return new Promise(res => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      if (asData) { try { res(c.toDataURL("image/jpeg", q)); } catch(e){ res(null); } } else c.toBlob(b=>res(b), "image/jpeg", q); };
    img.onerror = () => { URL.revokeObjectURL(u); res(null); }; img.src = u; });
}

const PROMPT = `Je bent een ervaren Nederlandse elektrotechnisch installateur. Je krijgt foto's van één groepenkast in een woning: de eerste is een overzichtsfoto, eventuele volgende zijn close-ups.
Lees de componenten af, van links naar rechts en van boven naar beneden.

Regels:
- Gok niet. Is een waarde niet leesbaar, gebruik null (of "?" bij tekst) en zet "zeker" op "laag".
- Koppel een groep alleen aan een aardlekschakelaar ("als") als de bedrading of kamrail dat duidelijk laat zien; anders "".
- Een installatieautomaat 1P+N van 1 module telt als één eindgroep. Aardlekautomaten (gecombineerd) neem je op als groep én noem je in de bevindingen.
- Bevindingen gaan over wat zichtbaar afwijkt of aandacht vraagt t.o.v. NEN 1010 (bijv. ontbrekende afdekking, groepen zonder aardlek, meer dan 4 groepen per aardlek, kleurcodering, losse/tijdelijke verbindingen, geen overspanningsbeveiliging). Kort en concreet, in het Nederlands.

Antwoord alleen met JSON in deze vorm:
{"aansluiting":"1-fase|3-fase|onbekend",
 "hoofdschakelaar":{"aanwezig":true,"polen":4,"In":40,"merkType":"","zeker":"hoog|midden|laag"},

 "overspanning":"ja|nee|onbekend",

      onText: ({text}) => { AI.text = text; const el = $("#aiout"); if (el) { el.textContent = text; el.scrollTop = el.scrollHeight; } } });

  } catch(e) {

/* ---------- display aflezen ---------- */
async function readDisplay(file){
  const {path, label, unit, id} = SNAP;
  if (!path || !sampleFn) return;
  SNAP.busy = path; render.keepScroll = true; render();
  const prompt = `Op deze foto staat het display van een installatietester (bijvoorbeeld een Fluke 1664 FC).
Gevraagd: de ${label}, in ${unit}.
Lees de hoofdwaarde van het display af. Reken om naar ${unit} als het display een andere eenheid toont (bijv. GΩ naar MΩ, s naar ms, kΩ naar Ω).
Toont het display een groter-dan of kleiner-dan waarde (bijv. ">999 MΩ"), zet dan het teken voor het getal in "waarde" als tekst, bijv. ">999".
Kun je het niet betrouwbaar lezen, of past de meetfunctie niet bij wat gevraagd is, zet "waarde" op null en leg kort uit waarom.
Antwoord alleen met JSON: {"waarde": 23.4 | ">999" | null, "afgelezen": "wat er letterlijk op het display staat", "functie": "welke meting het display toont", "zeker": "hoog|midden|laag", "opmerking": ""}`;
  try {
    const r = await sampleFn.json(prompt, {images:[file]});
    let w = r && r.waarde;
    if (w == null || w === "") { toast(`Niet afgelezen${r && r.opmerking ? ": " + r.opmerking : "."} Vul de waarde met de hand in.`); }
    else {
      w = typeof w === "number" ? String(w).replace(".", ",") : String(w).replace(".", ",");
      setPath(K, path, w); changed();
      SNAP.busy = null; render.keepScroll = true; render();
      const el = document.getElementById(id); if (el) { el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1600); }
      const lees = r.afgelezen ? ` (display: ${r.afgelezen})` : "";
      toast(r.zeker === "laag" ? `Ingevuld: ${w} ${unit}${lees}. Twijfelachtig, controleer even.` : `Ingevuld: ${w} ${unit}${lees}`);
      return;
    }
  } catch(e) {
    const c = e && e.code;
    toast(c==="not_granted"||c==="sampling_disabled" ? "Aflezen is niet toegestaan in deze weergave. Typ de waarde in."
      : c==="rate_limited" ? "Even te veel aanvragen. Typ de waarde in of probeer het zo opnieuw."
      : c==="image_rejected" ? "Deze foto kon niet worden gelezen. Probeer opnieuw." : "Aflezen lukte niet. Typ de waarde in.");
  }
  SNAP.busy = null; render.keepScroll = true; render();
}

  if (d.room) { OPEN_ROOM = OPEN_ROOM===d.room ? null : d.room; render.keepScroll = true; render(); if (OPEN_ROOM) { const el = document.querySelector(`[data-room="${OPEN_ROOM}"]`); if (el) el.scrollIntoView({block:"nearest"}); } return; }
  if (d.rg != null) { const r = K.ruimtes[+d.rg], nr = +d.nr; r.groepen = r.groepen.includes(nr) ? r.groepen.filter(x=>x!==nr) : r.groepen.concat(nr).sort((a,b)=>a-b); changed(); render.keepScroll=true; render(); return; }
  if (d.rchk != null) { const r = K.ruimtes[+d.rchk]; const cur = r.checks[d.k]?.s; r.checks[d.k] = {...(r.checks[d.k]||{}), s: cur===d.v ? "" : d.v}; changed(); render.keepScroll=true; render(); return; }
  if (d.addfoto) { const [ri,k] = d.addfoto.split("|"); FOTO_T = {ri:+ri, k}; $("#fotoin").click(); return; }
  if (d.delfoto) { const [ri,k,fi] = d.delfoto.split("|"); const arr = K.ruimtes[+ri].checks[k].f; const f = arr.splice(+fi,1)[0]; if (f && f.id) assetsLocal.delete(f.id).catch(()=>{}); changed(); render.keepScroll=true; render(); return; }
  if (d.addmp != null) { const r = K.ruimtes[+d.addmp]; r.mp.push({punt:"", groep: r.groepen.length ? String(r.groepen[0]) : "", zs:"", rpe:""}); changed(); render.keepScroll=true; render(); return; }
  if (d.delmp) { const [ri,pi] = d.delmp.split("|"); K.ruimtes[+ri].mp.splice(+pi,1); changed(); render.keepScroll=true; render(); return; }
  if (d.delroom != null) { const i = +d.delroom, nm = K.ruimtes[i].naam; pending = {title:`${nm||"Ruimte"} verwijderen?`, text:"De checks, foto's en metingen van deze ruimte worden verwijderd.", ok:"Verwijderen", danger:true, run:()=>{ K.ruimtes.splice(i,1); OPEN_ROOM=null; changed(); render(); }}; renderSheet(); return; }
  if (d.snap) { if (SNAP.busy) { toast("Even wachten, de vorige foto wordt nog gelezen."); return; } SNAP = {busy:null, path:d.snap, label:d.lbl, unit:d.unit, id:d.for}; $("#snapin").click(); return; }
  switch (d.act) {
    case "home": saveNow(); K = null; loadFotoUrlsReset(); PHOTOS = []; VIEW = "home"; window.scrollTo(0,0); render(); break;
    case "new": K = nieuweKeuring(); K.installateur = SET.installateur || ""; PHOTOS=[]; AI.result=null; AI.err=""; VIEW = "kast"; saveNow(); window.scrollTo(0,0); render(); break;
    case "example": K = voorbeeld(); PHOTOS=[]; AI.result=null; AI.err=""; VIEW = "groepen"; saveNow(); window.scrollTo(0,0); render(); break;
    case "analyse": analyse(); break;
    case "stop": AI.ctl && AI.ctl.abort(); break;
    case "apply":
      if (K.groepen.length) { pending = {title:"Groepenlijst vervangen?", text:`De huidige ${K.groepen.length} groepen en ${K.als.length} aardlekschakelaar(s) worden vervangen door wat Claude op de foto's zag. Ingevulde metingen gaan daarbij verloren.`, ok:"Vervangen", run:applyResult}; renderSheet(); }
      else applyResult(); break;
    case "discard": AI.result = null; render.keepScroll=true; render(); break;
    case "addgrp": { const last = K.groepen[K.groepen.length-1]; K.groepen.push({nr:K.groepen.length+1, kar:"B", In:16, polen:"1P+N", als:last?last.als:(K.als[0]?.id||""), omschr:"", mm2:"2,5", riso:"", zs:"", rpe:""}); changed(); render.keepScroll=true; render(); break; }
    case "settings": saveNow(); K = null; PHOTOS = []; VIEW = "settings"; window.scrollTo(0,0); render(); break;
    case "install": if (INSTALL) { INSTALL.prompt(); INSTALL.userChoice.finally(()=>{ INSTALL = null; render(); }); } break;
    case "savekey": { const v = ($("#s_key").value||"").trim(); if (!v) { toast("Plak eerst je sleutel in het veld."); break; } if (!/^sk-ant-/.test(v)) { toast("Een sleutel begint met sk-ant-. Controleer wat je hebt geplakt."); break; } SET.apiKey = v; saveSet(); render(); toast("Sleutel opgeslagen"); break; }
    case "delkey": SET.apiKey = ""; saveSet(); render(); toast("Sleutel verwijderd"); break;
    case "testkey": { toast("Verbinding testen…"); callClaude('Antwoord met {"ok":true}', [], undefined).then(()=>toast("Verbinding werkt")).catch(e=>toast(e.code==="auth"?"Sleutel wordt niet geaccepteerd.":e.code==="offline"?"Geen internetverbinding.":e.code==="bad_request"?`Geweigerd: ${e.message||"controleer je tegoed"}`:"Test mislukt, probeer het later opnieuw.")); break; }
    case "backup": exportBackup(); break;
    case "stdrooms": K.ruimtes = standaardRuimtes(); changed(); render(); toast("12 ruimtes toegevoegd. Pas ze aan waar nodig."); break;
    case "addroom": { const r = nieuweRuimte("Nieuwe ruimte","verblijf","Begane grond"); K.ruimtes = K.ruimtes||[]; K.ruimtes.push(r); OPEN_ROOM = r.id; changed(); render.keepScroll=true; render(); const el=document.getElementById(`rn_${r.id}`); if(el){ el.select(); el.scrollIntoView({block:"center"}); } break; }
    case "addals": { let n = K.als.length+1; while (K.als.some(a=>a.id==="A"+n)) n++; K.als.push({id:"A"+n, polen:K.aansluiting==="3-fase"?4:2, In:40, idn:30, type:"A", Ia:"", t1:"", t5:""}); changed(); render.keepScroll=true; render(); break; }
    case "askdel": pending = {title:"Keuring verwijderen?", text:"De keuring met alle groepen, checks en metingen wordt verwijderd. Dit kan niet ongedaan worden gemaakt.", ok:"Verwijderen", danger:true, run:()=>deleteKeuring(K.id)}; renderSheet(); break;
    case "confirm": { const r = pending && pending.run; pending = null; renderSheet(); if (r) r(); break; }
    case "cancel": if (e.target === t) { pending = null; renderSheet(); } break;
  }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && pending) { pending=null; renderSheet(); } });

render();
initRuntime();
</script>
</body>
